name: Build Mac DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build Mac DMG
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Download project source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build application and DMG
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v7
        with:
          name: Case-PDF-Downloader-macOS
          path: dist/*.dmg
          archive: false
          if-no-files-found: error
          retention-days: 14
